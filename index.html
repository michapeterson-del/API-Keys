<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API-Key Manager</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e2129;
    --border: #2a2e38;
    --text: #e8e9ec;
    --muted: #8b90a0;
    --accent: #6c8cff;
    --accent-2: #7d5fff;
    --danger: #ff6b6b;
    --success: #4cd97b;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at top, #1a1d26, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
    padding: 32px 16px 80px;
    overflow-x: hidden;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
  }
  header {
    text-align: center;
    margin-bottom: 28px;
  }
  header h1 {
    font-size: 1.6rem;
    margin: 0 0 6px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p {
    color: var(--muted);
    margin: 0;
    font-size: 0.9rem;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
  }
  .field {
    margin-bottom: 14px;
  }
  label {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 6px;
  }
  input[type="text"], input[type="password"], input[type="email"], select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-size: 0.95rem;
    outline: none;
  }
  input:focus, select:focus {
    border-color: var(--accent);
  }
  .key-row {
    display: flex;
    gap: 8px;
  }
  .key-row input { flex: 1; }
  .icon-btn {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 0 12px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .icon-btn:hover { border-color: var(--accent); }
  .provider-custom {
    margin-top: 8px;
    display: none;
  }
  .btn-primary {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    color: white;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .btn-primary:hover { opacity: 0.92; }
  .btn-primary:disabled { opacity: 0.6; cursor: default; }
  .btn-secondary {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    margin-top: 8px;
  }
  .btn-secondary:hover { border-color: var(--accent); }
  .list-title {
    font-size: 0.85rem;
    color: var(--muted);
    margin: 0 0 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .empty {
    color: var(--muted);
    font-size: 0.9rem;
    text-align: center;
    padding: 24px 0;
  }
  .item {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .item-top {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .item-name {
    font-weight: 600;
    font-size: 1rem;
  }
  .badge {
    display: inline-block;
    font-size: 0.7rem;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 9px;
    margin-top: 4px;
  }
  .item-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .item-actions button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 7px;
    padding: 5px 9px;
    font-size: 0.78rem;
    cursor: pointer;
  }
  .item-actions button:hover { color: var(--text); border-color: var(--accent); }
  .item-actions button.danger:hover { color: var(--danger); border-color: var(--danger); }
  .key-display {
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.85rem;
    color: var(--text);
    background: var(--panel);
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    word-break: break-all;
  }
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--panel-2);
    border: 1px solid var(--success);
    color: var(--success);
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 0.85rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    max-width: 90vw;
    text-align: center;
  }
  .toast.show { opacity: 1; }
  .toast.error { border-color: var(--danger); color: var(--danger); }
  .note {
    font-size: 0.78rem;
    color: var(--muted);
    text-align: center;
    margin-top: 24px;
    line-height: 1.5;
  }
  .auth-error {
    font-size: 0.82rem;
    color: var(--danger);
    margin-top: 10px;
    display: none;
  }
  .user-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .user-bar button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 7px;
    padding: 6px 12px;
    font-size: 0.78rem;
    cursor: pointer;
  }
  .user-bar button:hover { color: var(--text); border-color: var(--accent); }
  .hidden { display: none !important; }
  .switch-mode {
    text-align: center;
    font-size: 0.82rem;
    color: var(--muted);
    margin-top: 14px;
  }
  .switch-mode a { color: var(--accent); cursor: pointer; text-decoration: none; }
  .pw-change-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }
  .pw-change-row .field { flex: 1; margin-bottom: 0; }
  .pw-change-row button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.85rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .pw-change-row button:hover { color: var(--text); border-color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>API-Key Manager</h1>
    <p>Deine API-Keys, überall synchron</p>
  </header>

  <div id="auth-view">
    <div class="card">
      <form id="auth-form">
        <div class="field">
          <label for="email">E-Mail</label>
          <input type="email" id="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Passwort</label>
          <input type="password" id="password" required autocomplete="current-password" minlength="6">
        </div>
        <button type="submit" class="btn-primary" id="auth-submit">Anmelden</button>
        <p class="auth-error" id="auth-error"></p>
      </form>
    </div>
  </div>

  <div id="app-view" class="hidden">
    <div class="user-bar">
      <span id="user-email"></span>
      <div>
        <button id="pw-change-toggle">Passwort ändern</button>
        <button id="logout-btn">Abmelden</button>
      </div>
    </div>

    <div class="card hidden" id="pw-change-card">
      <form id="pw-change-form">
        <div class="pw-change-row">
          <div class="field">
            <label for="new-password">Neues Passwort</label>
            <input type="password" id="new-password" required minlength="8" autocomplete="new-password">
          </div>
          <button type="submit" id="pw-change-submit">Speichern</button>
        </div>
      </form>
    </div>

    <div class="card">
      <form id="key-form">
        <div class="field">
          <label for="name">Bezeichnung</label>
          <input type="text" id="name" placeholder="z. B. Privates Projekt" required>
        </div>

        <div class="field">
          <label for="provider">Gehostet bei</label>
          <select id="provider">
            <option value="Claude">Claude (Anthropic)</option>
            <option value="ChatGPT">ChatGPT (OpenAI)</option>
            <option value="Gemini">Gemini (Google)</option>
            <option value="Custom">Andere / egal</option>
          </select>
          <input type="text" id="provider-custom" class="provider-custom" placeholder="Anbieter eingeben">
        </div>

        <div class="field">
          <label for="key">API-Key</label>
          <div class="key-row">
            <input type="password" id="key" placeholder="sk-..." required>
            <button type="button" class="icon-btn" id="toggle-new-key">Anzeigen</button>
          </div>
        </div>

        <button type="submit" class="btn-primary" id="submit-btn">Key speichern</button>
      </form>
    </div>

    <div class="card">
      <p class="list-title">Gespeicherte Keys</p>
      <div id="list"></div>
    </div>

    <p class="note">
      Deine Keys werden verschlüsselt auf deinem eigenen Server gespeichert und sind nur für dich (über deinen Login) sichtbar —
      auf jedem Gerät identisch.
    </p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
